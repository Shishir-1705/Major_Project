version: '3.8'

services:
  urban-heat-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY:-}
    container_name: urban_heat_mysuru
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    environment:
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80
    volumes:
      - tile_cache:/app/.tile_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  tile_cache:
    name: urban_heat_tile_cache
